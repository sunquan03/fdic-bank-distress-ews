version: 2

models:
  - name: stg_fdic__financials
    columns:
      - name: bank_quarter_id
        tests:
          - unique
          - not_null
      - name: report_date
        tests:
          - not_null
  - name: stg_fdic__failures
    columns:
      - name: failure_id
        tests:
          - unique
          - not_null
      - name: cert
        tests:
          - not_null:
              config:
                where: "failure_date >= '2001-01-01'"
      - name: resolution_date
        description: all null values are pre-1990 
  - name: stg_fdic__institutions
    columns:
      - name: cert
        tests:
          - unique
          - not_null
      - name: bank_name
        tests:
          - not_null
  - name: stg_fdic__history
    columns:
      - name: transaction_number
        tests:
          - unique
          - not_null


