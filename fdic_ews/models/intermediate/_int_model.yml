version: 2

models:
  - name: int_bank_exits
    columns:
      - name: cert
        data_tests: 
          - unique
          - not_null
      - name: exit_date
        data_tests:
          - not_null        
      - name: exit_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['failure', 'ordinary', 'assisted'] 
  - name: int_bank_quarters
    data_tests:
       - dbt_utils.unique_combination_of_columns:
           arguments:
             combination_of_columns: ['cert', 'report_date']
    columns: 
      - name: cert
        data_tests:
          - not_null
      - name: bank_quarter_id
        data_tests:
          - unique
          - not_null
      - name: report_date
        data_tests:
          - not_null
  - name: int_bank_quarter_labels
    columns:
      - name: cert
        data_tests:
          - not_null
      - name: bank_quarter_id
        data_tests:
          - unique
          - not_null
      - name: report_date
        data_tests:
          - not_null
      - name: failure_in_year
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
  - name: int_bank_quarter_features
    columns: 
      - name: cert
        data_tests:
          - not_null
      - name: bank_quarter_id
        data_tests:
          - unique
          - not_null
      - name: report_date
        data_tests:
          - not_null
